name: 'Update Dependency Version'
description: 'Updates a dependency version in pyproject.toml for the given package manager, preserving extras/sources/metadata where supported'
inputs:
  package-manager:
    default: 'poetry'
    required: false
  package:
    required: true
  version:
    required: true
  pyproject-path:
    default: 'pyproject.toml'
    required: false

runs:
  using: 'composite'
  steps:
    - if: inputs.package-manager == 'poetry'
      uses: scene-connect/actions/update-dependency/poetry@v5
      with:
        package: ${{ inputs.package }}
        version: ${{ inputs.version }}
        pyproject-path: ${{ inputs.pyproject-path }}

    - if: inputs.package-manager == 'uv'
      uses: scene-connect/actions/update-dependency/uv@v5
      with:
        package: ${{ inputs.package }}
        version: ${{ inputs.version }}
        pyproject-path: ${{ inputs.pyproject-path }}
